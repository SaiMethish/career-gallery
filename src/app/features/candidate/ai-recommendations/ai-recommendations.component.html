<div class="ai-recs fade-in">
      <div class="ai-recs__header">
        <div class="ai-recs__badge">
          <i class="pi pi-sparkles" aria-hidden="true"></i>
          AI Powered
        </div>
        <h1 class="ai-recs__title">Recommended for You</h1>
        <p class="ai-recs__sub">
          Jobs matched to your profile skills and experience level.
        </p>
      </div>

      @if (isLoading()) {
        <div class="skeleton-list">
          @for (i of [1,2,3]; track i) { <div class="skeleton-card"></div> }
        </div>
      } @else if (recommendations().length === 0) {
        <app-empty-state icon="pi-sparkles" title="No recommendations yet"
          message="Complete your profile with skills and experience to get AI-powered matches." />
      } @else {
        <div class="recs-list">
          @for (rec of recommendations(); track rec.job.id) {
            <div class="rec-item">
              <div class="rec-item__score" [attr.aria-label]="'Match score: ' + rec.score + ' percent'">
                <span class="rec-item__score-num">{{ rec.score }}<span class="rec-item__score-pct">%</span></span>
                <span class="rec-item__score-label">Match</span>
              </div>
              <div class="rec-item__card">
                <app-job-card [job]="rec.job" [saved]="false"
                              (saveToggled)="onSave($event)"
                              (applied)="onApply($event)" />
              </div>
            </div>
          }
        </div>
      }
    </div>
