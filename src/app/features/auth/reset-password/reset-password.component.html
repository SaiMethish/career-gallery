<div class="auth-card fade-in">
      <div class="auth-header">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and a new password.</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <div class="form-field">
          <label for="email" class="form-label">Email Address</label>
          <input id="email" type="email" pInputText formControlName="email"
                 class="form-input" placeholder="name@company.com" aria-required="true" />
        </div>

        <div class="form-field">
          <label for="newPassword" class="form-label">New Password</label>
          <p-password id="newPassword" formControlName="newPassword"
                      styleClass="w-full" inputStyleClass="form-input w-full"
                      [toggleMask]="true" [feedback]="false"
                      placeholder="Enter new password" aria-required="true"></p-password>
        </div>

        <button type="submit" class="auth-btn" [disabled]="resetForm.invalid || isSubmitting()">
          @if (isSubmitting()) {
            <i class="pi pi-spinner pi-spin"></i> Resetting...
          } @else {
            Reset Password
          }
        </button>
      </form>

      <div class="auth-footer">
        <p>Remembered your password? <a routerLink="/auth/login" class="auth-link">Sign In</a></p>
      </div>
    </div>
