<p-card styleClass="job-card">

    <div class="job-header">

        <p-avatar label="C" shape="circle" size="large">
        </p-avatar>

        <div class="job-info">

            <div class="top-row">

                <h2>{{ job.title }}</h2>

                @if (showMatchScore) {
                <app-match-score-badge [score]="job.matchScore || 0">
                </app-match-score-badge>
                }

            </div>

            <p class="company">
                {{ job.company }} • {{ job.location }}
            </p>

            <p class="salary">
                {{ job.salary }}
            </p>

            <div class="skills">

                @for (skill of job.skills; track skill) {
                <p-tag [value]="skill"></p-tag>
                }

            </div>

        </div>

    </div>

    <div class="actions">

        <app-button label="Save" severity="secondary">
        </app-button>

        <app-button label="Apply Now">
        </app-button>

    </div>

</p-card>
