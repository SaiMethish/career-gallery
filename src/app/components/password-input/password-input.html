<div class="field-container">

  <label>{{ label }}</label>

  <p-password [formControl]="control" [toggleMask]="true" [feedback]="false" [placeholder]="placeholder"
    styleClass="w-full">
  </p-password>

  @if (control.invalid && control.touched) {
  <small class="error">
    Invalid {{ label }}
  </small>
  }

</div>
