<div class="field">
  <label>{{ label }}</label>

  @if (icon) {
    <p-iconfield iconPosition="left">
      <p-inputicon [class]="icon"></p-inputicon>
      <input
        pInputText
        [type]="type"
        [placeholder]="placeholder"
        [formControl]="control" />
    </p-iconfield>
  } @else {
    <input
      pInputText
      [type]="type"
      [placeholder]="placeholder"
      [formControl]="control" />
  }

  @if (control.invalid && control.touched) {
    <small class="error">
      Invalid {{ label }}
    </small>
  }
</div>
